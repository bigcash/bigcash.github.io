<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侯学明 | Xueming Hou</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .name-en {
            font-size: 20px;
            color: #718096;
            font-weight: 400;
            margin-bottom: 25px;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 25px auto;
            border-radius: 2px;
        }

        .position {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .position-en {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 20px;
        }

        .company {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .company-en {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
        }

        .contact {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .contact-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        .email {
            font-size: 18px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .email:hover {
            color: #764ba2;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">侯</div>
        
        <h1 class="name">侯学明</h1>
        <p class="name-en">Xueming Hou</p>
        
        <div class="divider"></div>
        
        <p class="position">高级算法工程师</p>
        <p class="position-en">Senior Algorithm Engineer</p>
        
        <p class="company">北京智慧荣升科技有限公司</p>
        <p class="company-en">Beijing Zhihui Rongsheng Technology Co., Ltd.</p>
        
        <div class="contact">
            <p class="contact-label">Contact / 联系方式</p>
            <a href="mailto:houxueming@gmail.com" class="email">houxueming@gmail.com</a>
        </div>
        
        <p class="footer">© 2026 Xueming Hou. All rights reserved.</p>
    </div>
</body>
</html>
